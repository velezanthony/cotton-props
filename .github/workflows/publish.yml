name: Publish

# Publishes to the Marketplace and Open VSX when a GitHub Release is published.
# Packaged once, so both registries get the same .vsix. `vsce package` runs
# `vscode:prepublish`, so the build still gates the publish.
#
# Secrets: VSCE_PAT (Azure DevOps, Marketplace → Manage) and OVSX_PAT. The Open
# VSX namespace must exist first: `npx ovsx create-namespace velezanthony`.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to the Marketplace and Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npx --yes @vscode/vsce package --out extension.vsix

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --packagePath extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Where Cursor, Windsurf and VSCodium install from.
      - name: Publish to Open VSX
        run: npx --yes ovsx publish extension.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
