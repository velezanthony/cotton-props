# Publishes https://velezanthony.github.io/cotton-props/
#
# docs-site/ is its own Node project (Astro + @velezanthony/design) with its own
# package-lock.json; nothing in the extension's package.json references it.
#
# The `paths:` filter is a second list of what the site publishes. It drifting
# out of sync with docs-site/docs.config.mjs is silent in the worst way — the
# workflow does not fail, it does not run — so docs-workflow.test.ts pins the
# two together.
name: Docs

on:
  push:
    branches: [main, development]
    paths:
      - 'docs/**'
      - '*.md'
      - 'src/**/README*.md'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5
        with:
          # The sitemap's <lastmod> is each file's last commit; a shallow clone has none.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The library's build is strict: a broken link or anchor fails it.
      - name: Build site
        # Empty in forks and locally, so those builds carry no analytics.
        env:
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
        run: npm run build

      # development validates only; a Pages failure there would read as broken docs.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
